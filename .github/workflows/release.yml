name: release
# Runs only after `ci` passed on a push to main, on exactly the commit CI tested (SPEC 18.5).
# Publishes with npm trusted publishing (OIDC): no NPM_TOKEN, provenance is added by npm.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
concurrency: release
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest # OIDC only on GitHub-hosted runners
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # no registry-url, no NODE_AUTH_TOKEN
      # outside the repo: package.json devEngines only allows pnpm there
      - run: npm i -g npm@11.21.0
        working-directory: ${{ runner.temp }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm test && pnpm smoke # again, in the release job
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
