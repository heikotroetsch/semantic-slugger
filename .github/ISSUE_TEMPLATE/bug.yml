name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Use only synthetic data.** Do not paste real customer, patient, employee or other confidential data, or real names.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Code, config and synthetic input.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: semantic-slugger version, runtime and version
    validations:
      required: true
  - type: checkboxes
    id: synthetic
    attributes:
      label: Data check
      options:
        - label: All data in this issue is invented. It contains no real customer, patient, employee or other confidential data, and no real names.
          required: true
