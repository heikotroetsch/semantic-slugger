name: Bad or ugly ID
description: An ID that is hard to read, misleading or offensive.
labels: [bad-id]
body:
  - type: markdown
    attributes:
      value: |
        **Use only a synthetic title.** Do not paste real customer, patient, employee or other confidential data, or real names.
        This repository is public.
  - type: input
    id: title
    attributes:
      label: Synthetic title
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field (domain)
      description: The kind of text the title comes from, for example blog, ticket, recipe, legal, medical or software.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The config you passed to createSlugger (no secrets).
      render: json
  - type: input
    id: id
    attributes:
      label: ID you got
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: ID you expected
  - type: input
    id: playground
    attributes:
      label: Playground link
  - type: checkboxes
    id: synthetic
    attributes:
      label: Data check
      options:
        - label: The title is invented. It contains no real customer, patient, employee or other confidential data, and no real names.
          required: true
